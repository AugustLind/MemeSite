<div class="modal fade" id="imageModal{{ loop_index }}" tabindex="-1" role="dialog"
     aria-labelledby="imageModalLabel{{ loop_index }}" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <form class="modal-content" method="POST" action="{{ url_for('views.create_meme') }}">
      <div class="modal-header">
        <h5 class="modal-title" id="imageModalLabel{{ loop_index }}">Image Meme Creation</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body text-center">
        <img src="{{ url_for('views.serve_image', filename=current_image) }}"
             class="img-fluid" style="max-height: 65vh;" alt="Selected meme image">
        <input type="hidden" name="image_filename" value="{{ current_image }}">
        <div class="form-group mt-3">
          <label for="memeText{{ loop_index }}">Enter Meme Text:</label>
          <textarea class="form-control" id="memeText{{ loop_index }}" name="memeText"
                    maxlength="1000" required placeholder="Type your meme text here"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="submit" class="btn btn-primary">Download Meme</button>
      </div>
    </form>
  </div>
</div>
